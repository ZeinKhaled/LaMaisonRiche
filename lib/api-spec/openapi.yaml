openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Shared storefront catalog data
  - name: uploads
    description: Catalog image uploads
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /data:
    get:
      operationId: getCatalogData
      tags: [catalog]
      summary: Read storefront catalog data
      responses:
        "200":
          description: Current products, categories, and offers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogData"
        "500":
          description: Catalog data could not be read
    post:
      operationId: saveCatalogData
      tags: [catalog]
      summary: Save storefront catalog data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogData"
      responses:
        "200":
          description: Saved catalog data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogData"
        "400":
          description: Invalid catalog payload
  /upload:
    post:
      operationId: uploadCatalogImage
      tags: [uploads]
      summary: Upload a catalog image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Public upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Invalid or oversized image upload
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CatalogData:
      type: object
      required: [products, categories, offers]
      properties:
        products:
          type: array
          items:
            type: object
            additionalProperties: true
        categories:
          type: array
          items:
            type: object
            additionalProperties: true
        offers:
          type: array
          items:
            type: object
            additionalProperties: true
    UploadResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string

